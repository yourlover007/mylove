<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For U My Love</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            margin: 0;
            padding: 0;
            text-align: center;
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        header {
            background-color: #ff4d88;
            padding: 20px;
            color: white;
            font-size: 24px;
            animation: slideDown 1.5s ease-in-out;
        }
        @keyframes slideDown {
            from {transform: translateY(-50px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }
        .container {
            padding: 20px;
        }
        .message {
            font-size: 18px;
            color: #333;
            margin-top: 20px;
            animation: fadeInUp 2s ease-in-out;
        }
        @keyframes fadeInUp {
            from {transform: translateY(30px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .gallery img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: scale(1);
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #ffccdd;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        .modal-content img {
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .modal-content p {
            font-family: 'Cursive', sans-serif;
            font-size: 20px;
            color: #333;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>For U My Love</header>
    <div class="container">
        <div class="message">
            <p>This website is dedicated to showing how much I love you, filled with beautiful memories of us together.</p>
        </div>
        <div class="gallery">
            <a href="image1.html"><img src="Screenshot_2024-11-19-22-27-12-903_com.miui.gallery.jpg" alt="Lovely moment 1"></a>
            <a href="image2.html"><img src="Snapchat-1081746416.jpg" alt="Lovely moment 2"></a>
            <a href="image3.html"><img src="Snapchat-1512510702.jpg" alt="Lovely moment 3"></a>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Lovely moment">
            <p id="modal-text"></p>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modal-image');
        const modalText = document.getElementById('modal-text');

        const imageDetails = [
            {
                src: "Screenshot_2024-11-19-22-27-12-903_com.miui.gallery.jpg",
                text: "This was one of the most beautiful moments we shared together."
            },
            {
                src: "Snapchat-1081746416.jpg",
                text: "A memory that will always stay close to my heart."
            },
            {
                src: "Snapchat-1512510702.jpg",
                text: "Every moment with you feels like magic."
            }
        ];

        function openModal(index) {
            modal.style.display = 'flex';
            modalImage.src = imageDetails[index - 1].src;
            modalText.textContent = imageDetails[index - 1].text;
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
